name: Julia SOS reviewer audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: julia-reviewer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.10'
      - uses: julia-actions/cache@v2
        with:
          delete-old-caches: 'false'
      - name: Complete advertised reviewer command
        shell: bash
        run: |
          set -o pipefail
          julia --startup-file=no --project=julia_sos julia_sos/run_all.jl 2>&1 | tee reviewer-run.log
      - name: Export complete reviewer source
        shell: bash
        run: |
          mkdir -p release-artifact
          git archive --format=zip --output=release-artifact/SCL_reviewer_source.zip HEAD README.md .gitattributes SOURCE_REVISION.txt docs julia_sos evidence paper
          git rev-parse HEAD > release-artifact/TESTED_COMMIT.txt
      - name: Verify source-only export without a Git checkout
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scl-export"
          unzip -q release-artifact/SCL_reviewer_source.zip -d "$RUNNER_TEMP/scl-export"
          cd "$RUNNER_TEMP/scl-export"
          test ! -d .git
          test "$(cat SOURCE_REVISION.txt)" = "$(cat "$GITHUB_WORKSPACE/release-artifact/TESTED_COMMIT.txt")"
          julia --startup-file=no --project=julia_sos julia_sos/experiments/release_check.jl
          julia --startup-file=no --project=julia_sos julia_sos/test/archive_portability.jl
          julia --startup-file=no --project=julia_sos julia_sos/experiments/replay_all.jl
      - name: Preserve tested source and current execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-release-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release-artifact/
            reviewer-run.log
            julia_sos/results/
          retention-days: 90
  manuscript:
    needs: audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build unchanged manuscript source
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-publishers texlive-science
          cd paper
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > build.log
          bibtex main >> build.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex >> build.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex >> build.log
          if grep -q 'undefined citations\|undefined references' main.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            paper/main.pdf
            paper/main.log
            paper/build.log
          retention-days: 90
  cleanup:
    needs: [audit, manuscript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete only this authorized, merged freeze branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'fix/reviewer-release-freeze';
            const pulls = await github.rest.pulls.list({...context.repo, state:'closed', head:context.repo.owner + ':' + branch, base:'main', per_page:100});
            const p = pulls.data.find(p => p.merged_at && p.head.ref === branch && p.head.repo && p.head.repo.full_name === context.repo.owner + '/' + context.repo.repo);
            if (!p) return;
            try {
              const ref = (await github.rest.git.getRef({...context.repo, ref:'heads/' + branch})).data;
              if (ref.object.sha !== p.head.sha) throw new Error('Freeze branch moved after merge; refusing deletion.');
              const comparison = (await github.rest.repos.compareCommitsWithBasehead({...context.repo, basehead:p.head.sha + '...' + context.sha})).data;
              if (!['ahead','identical'].includes(comparison.status)) throw new Error('Tested main does not contain the freeze head.');
              await github.rest.git.deleteRef({...context.repo, ref:'heads/' + branch});
              core.notice('Deleted only ' + branch + ' after Linux, Windows and manuscript checks passed on main.');
            } catch (e) {
              if (e.status !== 404) throw e;
              core.notice('Merged freeze branch already absent.');
            }
