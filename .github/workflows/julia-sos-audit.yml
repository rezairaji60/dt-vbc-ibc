name: Julia SOS reviewer audit
on:
  pull_request:
    paths:
      - 'julia_sos/**'
      - '.github/workflows/julia-sos-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: julia-sos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.10'
      - uses: julia-actions/cache@v2
      - name: Instantiate recorded Julia environment
        run: julia --project=julia_sos -e 'using Pkg; Pkg.instantiate(); Pkg.precompile(); Pkg.status()'
      - name: Exact proof tests and genuine SOS test
        shell: bash
        run: |
          mkdir -p julia_sos/results
          set -o pipefail
          julia --project=julia_sos julia_sos/test/runtests.jl 2>&1 | tee julia_sos/results/tests.log
      - name: Current-case synthesis and normalization ablation
        shell: bash
        run: |
          set -o pipefail
          julia --project=julia_sos julia_sos/experiments/run_audit.jl 2>&1 | tee julia_sos/results/audit.log
      - name: Preserve reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: julia-sos-audit-${{ github.sha }}
          path: |
            julia_sos/Project.toml
            julia_sos/Manifest.toml
            julia_sos/results/
          retention-days: 14
      - name: Record tested evidence on this private PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = ['tests.log', 'audit.log', 'summary.json'];
            const sections = [];
            for (const file of files) {
              const p = 'julia_sos/results/' + file;
              if (fs.existsSync(p)) {
                const text = fs.readFileSync(p, 'utf8').slice(-14000).replace(/```/g, '~~~');
                sections.push('### ' + file + '\n```text\n' + text + '\n```');
              }
            }
            const head = context.payload.pull_request.head.sha;
            const body = '## Julia audit execution evidence\nHead: `' + head + '`\nRun: ' + context.runId + '\n\n' + sections.join('\n\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
